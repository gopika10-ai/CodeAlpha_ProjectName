<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>



<style>

body {
  margin: 0;
  min-height: 100vh;
  background: #0f2027;
  overflow: hidden;
  font-family: Arial, sans-serif;
}


.bubbles {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  overflow: hidden;
  z-index: 0;   
}

.bubbles li {
  position: absolute;
  list-style: none;
  width: 40px;
  height: 40px;
  background: rgba(255, 255, 255, 0.3);
  animation: rise 20s linear infinite;
  bottom: -150px;
  border-radius: 50%;
}


.bubbles li:nth-child(1) { left: 10%; width: 30px; height: 30px; animation-duration: 12s; }
.bubbles li:nth-child(2) { left: 20%; width: 50px; height: 50px; animation-duration: 18s; }
.bubbles li:nth-child(3) { left: 35%; width: 20px; height: 20px; animation-duration: 10s; }
.bubbles li:nth-child(4) { left: 50%; width: 60px; height: 60px; animation-duration: 22s; }
.bubbles li:nth-child(5) { left: 65%; width: 25px; height: 25px; animation-duration: 14s; }
.bubbles li:nth-child(6) { left: 80%; width: 45px; height: 45px; animation-duration: 16s; }

@keyframes rise {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  50% {
    opacity: 0.6;
  }
  100% {
    transform: translateY(-1200px);
    opacity: 0;
  }
}


.login-box {
  position: relative;
  z-index: 1; 
  width: 350px;
  margin: 100px auto;
  padding: 20px;
  border: 2px solid black;
  border-radius: 20px;
  background: white;
}
</style>
</head>

<body>


<ul class="bubbles">
  <li></li><li></li><li></li>
  <li></li><li></li><li></li>
</ul>


<div class="login-box">
  <h2 style="text-align:center;color:red;">Login Page 🎓</h2>

  Name <input type="text"><br><br>
  Email <input type="email"><br><br>
  Phone <input type="text"><br><br>
  Password <input type="password"><br><br>

<nav><button><a href="index1.html">Login</a></button></nav>
</div>

</body>
</html>
